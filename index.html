<html lang="id" class="dark">

<head>

    <title>Master Hiragana & Katakana - Lengkap & Interaktif</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- HEADER -->

        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2 text-indigo-400">
                    🇯🇵 Huruf Jepang
                </h1>
                <p class="text-slate-400 text-xs mt-0.5" id="header-sub">Hiragana, Katakana, Dakuon, Youon, & Aturan
                    Spesial (ID / EN)</p>
            </div>

            <div class="flex items-center gap-3">
                <!-- Tombol Ganti Tema (Dark/Light) -->
                <button onclick="toggleTheme()" id="theme-btn"
                    class="p-2 rounded-lg bg-slate-800 text-yellow-400 hover:bg-slate-700 transition text-sm flex items-center gap-1 font-medium"
                    title="Ganti Tema">
                    ☀️ <span id="theme-text" class="text-xs">Light</span>
                </button>

                <!-- Pilihan Bahasa Terjemahan -->
                <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700">
                    <button onclick="setLang('id')" id="btn-id"
                        class="px-3 py-1 rounded bg-indigo-600 text-white font-semibold text-xs transition">ID</button>
                    <button onclick="setLang('en')" id="btn-en"
                        class="px-3 py-1 rounded text-slate-400 hover:text-white font-semibold text-xs transition">EN</button>
                </div>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- Navigasi Jenis Kategori / Tab -->
        <div class="flex flex-wrap justify-center gap-2 mb-6">
            <button onclick="switchTab('hiragana')" id="tab-hiragana"
                class="px-4 py-2 rounded-xl font-semibold text-xs sm:text-sm transition bg-indigo-600 text-white shadow-sm">
                Hiragana Dasar
            </button>
            <button onclick="switchTab('katakana')" id="tab-katakana"
                class="px-4 py-2 rounded-xl font-semibold text-xs sm:text-sm transition bg-slate-900 text-slate-400 hover:text-white border border-slate-800">
                Katakana Dasar
            </button>
            <button onclick="switchTab('dakuon')" id="tab-dakuon"
                class="px-4 py-2 rounded-xl font-semibold text-xs sm:text-sm transition bg-slate-900 text-slate-400 hover:text-white border border-slate-800">
                Dakuon & Handakuon
            </button>
            <button onclick="switchTab('youon')" id="tab-youon"
                class="px-4 py-2 rounded-xl font-semibold text-xs sm:text-sm transition bg-slate-900 text-slate-400 hover:text-white border border-slate-800">
                Youon (Gabungan)
            </button>
            <button onclick="switchTab('special')" id="tab-special"
                class="px-4 py-2 rounded-xl font-semibold text-xs sm:text-sm transition bg-slate-900 text-slate-400 hover:text-white border border-slate-800">
                Sokuon & Choonpu
            </button>
        </div>

        <!-- Deskripsi Tab -->
        <div id="tab-desc"
            class="bg-slate-900 border-l-4 border-indigo-500 p-4 rounded-r-xl mb-8 text-sm text-slate-300 border border-slate-800 shadow-sm">
            <!-- Diisi dinamis via JS -->
        </div>

        <!-- Grid Kartu Huruf / Konten -->
        <div id="content-container">
            <!-- Diisi dinamis via JS -->
        </div>

    </main>

    <!-- MODAL DETAIL KOSAKATA -->
    <div id="detail-modal"
        class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="closeModal()"
                class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold">&times;</button>

            <div class="text-center">
                <div id="modal-char" class="text-6xl font-bold text-indigo-400 mb-2">あ</div>
                <div id="modal-romaji" class="text-sm font-semibold text-slate-400 uppercase tracking-widest mb-4">a
                </div>
                <button id="modal-play-btn" type="button"
                    onclick="playRomaji(this.dataset.romaji, this, this.dataset.spoken)"
                    class="mx-auto mb-4 w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white transition items-center justify-center"
                    title="Dengarkan pelafalan" aria-label="Dengarkan pelafalan">
                    &#9654;
                </button>

                <div class="border-t border-slate-800 pt-4 text-left">

                    <div

                            <span id="modal-word-reading" class="text-xs text-slate-400">--</span>
                        </div>
                        <div class="text-right">
                            <span id="modal-word-trans" class="text-sm font-medium text-indigo-400 block">--</span>
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="closeModal()"
                class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition text-sm">
                Tutup / Close
            </button>
        </div>
    </div>

        <p id="footer-text">Copyright &copy; 2026 shinraDaemon.</p>

                    { jp: "ちょ / チョ", romaji: "cho", wordJp: "ちょきん / チョキン", wordRead: "chokin", trans: "Savings" },
                    { jp: "にゃ / ニャ", romaji: "nya", wordJp: "にゃんこ / ニャンコ", wordRead: "nyanko", trans: "Kitten" },
                    { jp: "にゅ / ニュ", romaji: "nyu", wordJp: "にゅうがく / ニュウガク", wordRead: "nyuugaku", trans: "School enrollment" },
                    { jp: "にょ / ニョ", romaji: "nyo", wordJp: "にょきにょき / ニョキニョキ", wordRead: "nyoki nyoki", trans: "Sprouting rapidly" },
                    { jp: "ひゃ / ヒャ", romaji: "hya", wordJp: "ひゃく / ヒャク", wordRead: "hyaku", trans: "Hundred" },
                    { jp: "ひゅ / ヒュ", romaji: "hyu", wordJp: "ひゅうが / ヒュウガ", wordRead: "Hyuuga", trans: "Place name" },
                    { jp: "ひょ / ヒョ", romaji: "hyo", wordJp: "ひょっとこ / ヒョットコ", wordRead: "hyottoko", trans: "Traditional mask" },
                    { jp: "びゃ / ビャ", romaji: "bya", wordJp: "さんびゃく / サンビャク", wordRead: "sanbyaku", trans: "Three hundred" },
                    { jp: "びゅ / ビュ", romaji: "byu", wordJp: "びゅんびゅん / ビュンビュン", wordRead: "byunbyun", trans: "Whizzing sound" },
                    { jp: "びょ / ビョ", romaji: "byo", wordJp: "びょういん / ビョウイン", wordRead: "byouin", trans: "Hospital" },
                    { jp: "ぴゃ / ピャ", romaji: "pya", wordJp: "はっぴゃく / ハッピャク", wordRead: "happyaku", trans: "Eight hundred" },
                    { jp: "ぴゅ / ピュ", romaji: "pyu", wordJp: "ぴゅあ / ピュア", wordRead: "pyua", trans: "Pure" },
                    { jp: "ぴょ / ピョ", romaji: "pyo", wordJp: "ぴょんぴょん / ピョンピョン", wordRead: "pyonpyon", trans: "Hopping" },
                    { jp: "みゃ / ミャ", romaji: "mya", wordJp: "みゃく / ミャク", wordRead: "myaku", trans: "Pulse" },
                    { jp: "みゅ / ミュ", romaji: "myu", wordJp: "みゅうじあむ / ミュージアム", wordRead: "myuujiamu", trans: "Museum" },
                    { jp: "みょ / ミョ", romaji: "myo", wordJp: "みょうじ / ミョウジ", wordRead: "myouji", trans: "Surname" },
                    { jp: "りゃ / リャ", romaji: "rya", wordJp: "りゃくす / リャクス", wordRead: "ryakusu", trans: "To abbreviate" },
                    { jp: "りゅ / リュ", romaji: "ryu", wordJp: "りゅう / リュウ", wordRead: "ryuu", trans: "Dragon" },
                    { jp: "りょ / リョ", romaji: "ryo", wordJp: "りょこう / リョコウ", wordRead: "ryokou", trans: "Travel / Trip" }
                ],
                special: [
                    { jp: "っ / ッ (Sokuon)", romaji: "Double Consonant", wordJp: "きって / ざっし", wordRead: "kitte / zasshi", trans: "Indicates a pause/double consonant (Stamp / Magazine)" },
                    { jp: "ー (Choonpu)", romaji: "Long Vowel", wordJp: "コーヒー / ケーキ", wordRead: "koohii / keeki", trans: "Katakana long vowel line extender (Coffee / Cake)" }
                ]
            }
        };

        let currentLang = 'id';
        let currentTab = 'hiragana';
        let isDarkMode = true;
        const gojuonAudio = new Set([
            'a', 'i', 'u', 'e', 'o', 'ka', 'ki', 'ku', 'ke', 'ko',
            'sa', 'shi', 'su', 'se', 'so', 'ta', 'chi', 'tsu', 'te', 'to',
            'na', 'ni', 'nu', 'ne', 'no', 'ha', 'hi', 'fu', 'he', 'ho',
            'ma', 'mi', 'mu', 'me', 'mo', 'ya', 'yu', 'yo', 'ra', 'ri',
            'ru', 're', 'ro', 'wa', 'wo', 'n'
        ]);
        let activeAudio = null;

        function playRomaji(romaji, button, spokenText) {
            if (!romaji) return;

            if (activeAudio) {
                activeAudio.pause();
                activeAudio.currentTime = 0;
            }
            window.speechSynthesis?.cancel();

            if (gojuonAudio.has(romaji)) {
                activeAudio = new Audio(`voice/gojuon/${romaji}.mp3`);
                activeAudio.play().catch(() => {
                    if (button) button.title = 'Audio tidak dapat diputar';
                });
                return;
            }

            if (!spokenText || !('speechSynthesis' in window)) {
                if (button) button.title = 'Audio belum tersedia';
                return;
            }

            const utterance = new SpeechSynthesisUtterance(spokenText);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.75;
            window.speechSynthesis.speak(utterance);
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;
            const body = document.body;
            const themeBtn = document.getElementById('theme-btn');
            const header = document.querySelector('header');
            const footer = document.querySelector('footer');
            const tabDesc = document.getElementById('tab-desc');
            const modalContent = document.querySelector('#detail-modal > div');

            if (isDarkMode) {
                body.className = "bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300";
                header.className = "bg-slate-900 border-b border-slate-800 shadow-md sticky top-0 z-40";
                footer.className = "bg-slate-900 border-t border-slate-800 mt-12 py-6 text-center text-xs text-slate-500";
                themeBtn.className = "p-2 rounded-lg bg-slate-800 text-yellow-400 hover:bg-slate-700 transition text-sm flex items-center gap-1 font-medium";
                themeBtn.innerHTML = `☀️ <span id="theme-text" class="text-xs">Light</span>`;
                tabDesc.className = "bg-slate-900 border-l-4 border-indigo-500 p-4 rounded-r-xl mb-8 text-sm text-slate-300 border border-slate-800 shadow-sm";
                modalContent.className = "bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl relative";
            } else {
                body.className = "bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between transition-colors duration-300";
                header.className = "bg-indigo-600 text-white shadow-md sticky top-0 z-40";
                footer.className = "bg-white border-t border-slate-200 mt-12 py-6 text-center text-xs text-slate-500";
                themeBtn.className = "p-2 rounded-lg bg-indigo-700 text-white hover:bg-indigo-800 transition text-sm flex items-center gap-1 font-medium";
                themeBtn.innerHTML = `🌙 <span id="theme-text" class="text-xs">Dark</span>`;
                tabDesc.className = "bg-indigo-50 border-l-4 border-indigo-500 p-4 rounded-r-lg mb-8 text-sm text-indigo-900 shadow-sm";
                modalContent.className = "bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative";
            }
            renderContent();
            updateTabStyles();
        }

        function setLang(lang) {
            currentLang = lang;
            if (lang === 'id') {
                document.getElementById('btn-id').className = "px-3 py-1 rounded bg-indigo-600 text-white font-semibold text-xs transition";
                document.getElementById('btn-en').className = "px-3 py-1 rounded text-slate-400 hover:text-white font-semibold text-xs transition";
            } else {
                document.getElementById('btn-en').className = "px-3 py-1 rounded bg-indigo-600 text-white font-semibold text-xs transition";
                document.getElementById('btn-id').className = "px-3 py-1 rounded text-slate-400 hover:text-white font-semibold text-xs transition";
            }
            renderContent();
        }

        function switchTab(tab) {
            currentTab = tab;
            updateTabStyles();
            renderContent();
        }

        function updateTabStyles() {
            const tabs = ['hiragana', 'katakana', 'dakuon', 'youon', 'special'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === currentTab) {
                    btn.className = "px-4 py-2 rounded-xl font-semibold text-xs sm:text-sm transition bg-indigo-600 text-white shadow-sm";
                } else {
                    btn.className = isDarkMode
                        ? "px-4 py-2 rounded-xl font-semibold text-xs sm:text-sm transition bg-slate-900 text-slate-400 hover:text-white border border-slate-800"
                        : "px-4 py-2 rounded-xl font-semibold text-xs sm:text-sm transition bg-white text-slate-600 hover:text-indigo-600 border border-slate-200 shadow-sm";
                }
            });
        }

        function renderContent() {
            const t = data[currentLang];

            let descText = t.tabHiraganaDesc;
            if (currentTab === 'katakana') descText = t.tabKatakanaDesc;
            if (currentTab === 'dakuon') descText = t.tabDakuonDesc;
            if (currentTab === 'youon') descText = t.tabYouonDesc;
            if (currentTab === 'special') descText = t.tabSpecialDesc;

            document.getElementById('tab-desc').innerHTML = descText;
            document.getElementById('label-example').innerText = t.exampleLabel;

            const container = document.getElementById('content-container');
            container.innerHTML = '';

            let items = t.characters;
            if (currentTab === 'katakana') items = t.katakana;
            if (currentTab === 'dakuon') items = t.dakuon;
            if (currentTab === 'youon') items = t.youon;
            if (currentTab === 'special') items = t.special;

            const grid = document.createElement('div');
            grid.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4";

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = isDarkMode
                    ? "bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-sm hover:shadow-indigo-500/10 hover:border-indigo-500/50 flex flex-col items-center justify-center cursor-pointer transition transform hover:-translate-y-1"
                    : "bg-white border border-slate-100 p-5 rounded-2xl shadow-sm hover:shadow-md flex flex-col items-center justify-center cursor-pointer transition transform hover:-translate-y-1";

                card.onclick = () => openModal(item);
                const audioRomaji = item.romaji.split(' / ')[0].trim();
                const hasAudio = gojuonAudio.has(audioRomaji);
                const spokenText = item.wordJp.split(' / ')[0].replace(/\([^)]*\)/g, '').trim();
                card.innerHTML = `
                    <span class="text-3xl sm:text-4xl font-bold ${isDarkMode ? 'text-indigo-400' : 'text-indigo-600'} mb-1 text-center">${item.jp}</span>
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider text-center">${item.romaji}</span>
                    <button type="button" class="audio-btn mt-3 w-9 h-9 rounded-full ${hasAudio ? 'bg-indigo-600 hover:bg-indigo-700 text-white' : 'bg-indigo-600 hover:bg-indigo-700 text-white'} flex items-center justify-center transition" title="Dengarkan pelafalan" aria-label="Dengarkan pelafalan">
                        &#9654;
                    </button>
                `;
                const audioButton = card.querySelector('.audio-btn');
                audioButton.onclick = event => {
                    event.stopPropagation();
                    playRomaji(audioRomaji, audioButton, spokenText);
                };
                grid.appendChild(card);
            });
            container.appendChild(grid);
        }

        function openModal(item) {
            document.getElementById('modal-char').innerText = item.jp;
            document.getElementById('modal-romaji').innerText = "Romaji: " + item.romaji;
            document.getElementById('modal-word-jp').innerText = item.wordJp;
            document.getElementById('modal-word-reading').innerText = "(" + item.wordRead + ")";
            document.getElementById('modal-word-trans').innerText = item.trans;

            const modalPlayButton = document.getElementById('modal-play-btn');
            const audioRomaji = item.romaji.split(' / ')[0].trim();
            const spokenText = item.wordJp.split(' / ')[0].trim();
            modalPlayButton.dataset.romaji = audioRomaji;
            modalPlayButton.dataset.spoken = spokenText;
            modalPlayButton.classList.toggle('flex', true);
            modalPlayButton.classList.toggle('hidden', false);
            modalPlayButton.disabled = false;

            const modal = document.getElementById('detail-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('detail-modal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        // Inisialisasi awal
        updateTabStyles();
        renderContent();
    </script>
</body>

</html>
